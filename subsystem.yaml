# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: tools-shortcut-hub                 # ตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
display_name: "ระบบ CSLink 352"
repo: github.com/CSMJU2030/csmju-tools-shortcut-hub
standards_version: "1.0.0"
conformance_level: L3

base_url: http://localhost:3001
core_hub_url: http://localhost:3000
callback_path: /auth/callback

public_endpoints:
  - GET /api/health
  - GET /auth/callback

probes:
  collection: /api/v1/courses
  not_found: /api/v1/courses/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/courses/not-a-uuid
  create:
    path: /api/v1/courses
    allowed_role: staff
    denied_role: student
    invalid_body:
      course_code: nope
      credits: 999
    valid_body:
      courseCode: CS777
      name: Conformance Probe
      credits: 3

owners:
  pl: "@csmju2030/pl-tools-shortcut-hub"
  aie: "@csmju2030/aie-tools-shortcut-hub"
